<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRIS Payment</title>
    <style>
        /* Menggunakan font modern bawaan sistem (seperti Apple/iOS) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #09090b; /* Deep black (zinc-950) */
            color: #ffffff;
            position: relative;
            overflow: hidden; /* Mencegah scroll karena efek blur background */
        }

        /* Efek Glow Merah di Belakang Kaca (Glassmorphism Ambient) */
        .glow-1 {
            position: absolute;
            top: 20%;
            left: 30%;
            width: 300px;
            height: 300px;
            background-color: rgba(220, 38, 38, 0.25); /* Merah transparan */
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .glow-2 {
            position: absolute;
            bottom: 20%;
            right: 30%;
            width: 250px;
            height: 250px;
            background-color: rgba(185, 28, 28, 0.2); /* Merah lebih gelap */
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
        }

        /* Card Frosted Glass */
        .glass-container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 1.5rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            
            /* Penyesuaian agar tidak merapat ke tepi */
            box-sizing: border-box;
            max-width: 400px;
            width: 85%;
            margin: 0 auto;
            
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Styling Gambar QRIS */
        .qris-img {
            width: 100%;
            height: auto;
            border-radius: 1rem;
            display: block;
        }
    </style>
    <meta property="og:image" content="https://nemospiritgeek.my.id/qris.jpg">
</head>
<body>
    <!-- Elemen Glow Background -->
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <!-- Kontainer Utama -->
    <div class="glass-container">
        <img src="https://nemospiritgeek.my.id/qris.jpg" alt="QRIS" class="qris-img">
    </div>
</body>
</html>
