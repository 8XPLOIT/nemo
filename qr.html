<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRIS Payment</title>
    <style>
        /* Menggunakan font modern bawaan sistem (seperti Apple/iOS) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #09090b; /* Deep black (zinc-950) */
            color: #ffffff;
            position: relative;
            overflow: hidden; /* Mencegah scroll karena efek blur background */
        }

        /* Efek Glow Merah di Belakang Kaca (Glassmorphism Ambient) */
        .glow-1 {
            position: absolute;
            top: 20%;
            left: 30%;
            width: 300px;
            height: 300px;
            background-color: rgba(220, 38, 38, 0.25); /* Merah transparan */
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .glow-2 {
            position: absolute;
            bottom: 20%;
            right: 30%;
            width: 250px;
            height: 250px;
            background-color: rgba(185, 28, 28, 0.2); /* Merah lebih gelap */
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
        }

        /* Wrapper Utama agar posisi teks, card, dan tombol rapi vertikal */
        .main-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 400px;
            width: 85%;
            margin: 0 auto;
        }

        /* Teks Instruksi di Atas Kontainer */
        .instruction-text {
            margin: 0 0 1rem 0;
            color: #a1a1aa; /* Muted gray (zinc-400) */
            font-size: 0.85rem;
            line-height: 1.4;
            text-align: center;
            padding: 0 0.5rem;
        }

        /* Card Frosted Glass */
        .glass-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 1.25rem;
            border-radius: 2rem; /* Menyesuaikan kelengkungan gambar */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Styling Gambar QRIS (Lebih membulat) */
        .qris-img {
            width: 100%;
            height: auto;
            border-radius: 1.75rem;
            display: block;
        }

        /* Tombol Download Aksen Merah Minimalis */
        a.btn-download {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 1.25rem;
            background-color: #dc2626; /* Solid Red */
            color: #ffffff;
            text-decoration: none;
            padding: 0.875rem 1.5rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.01em;
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
            box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.35);
        }

        a.btn-download:hover {
            background-color: #b91c1c; /* Merah gelap saat di-hover */
            transform: translateY(-2px);
        }

        a.btn-download:active {
            transform: translateY(0);
        }
    </style>
    <meta property="og:title" content="QRIS Payment">
    <meta property="og:description" content="Scan kode QRIS untuk menyelesaikan transaksi dengan cepat dan aman.">
    <meta property="og:image" content="https://nemospiritgeek.my.id/qris.jpg">
</head>
<body>
    <!-- Elemen Glow Background -->
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <!-- Wrapper Utama -->
    <div class="main-wrapper">
        <!-- Teks Kecil di Atas Kontainer -->
        <p class="instruction-text">Silahkan DOWNLOAD atau SCREENSHOOT dan SCAN QRIS ini untuk melanjutkan pembayaran.</p>

        <!-- Kontainer Kaca -->
        <div class="glass-container">
            <img src="https://nemospiritgeek.my.id/qris.jpg" alt="QRIS" class="qris-img">
        </div>

        <!-- Tombol Download di Bawah Kontainer -->
        <a href="https://nemospiritgeek.my.id/qris.jpg" download="QRIS.jpg" class="btn-download">Download QRIS (109 KB)</a>
    </div>
</body>
</html>
